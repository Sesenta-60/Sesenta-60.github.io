<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 - Archivos de Clase</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: url('https://images.unsplash.com/photo-1633113089631-6456cccaadad?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; user-select: none; }
        .desktop { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Window Styles */
        .window {
            width: 900px; height: 600px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
            border: 1px solid rgba(255,255,255,0.5);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .title-bar { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .controls { display: flex; gap: 8px; }
        .control { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .close { background: #ff5f57; } .min { background: #febc2e; } .max { background: #28c840; }
        
        .nav-bar { padding: 10px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); background: rgba(255,255,255,0.4); }
        .nav-btn { cursor: pointer; padding: 5px 10px; border: none; background: transparent; font-size: 1.2em; border-radius: 4px; }
        .nav-btn:hover { background: rgba(0,0,0,0.05); }
        .path-box { font-size: 0.9em; color: #555; margin-left: 10px; }

        .content { flex-grow: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; align-content: start; }
        
        .icon { display: flex; flex-direction: column; align-items: center; padding: 10px; border-radius: 4px; cursor: pointer; transition: background 0.2s; text-align: center; }
        .icon:hover { background: rgba(255,255,255,0.5); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .icon-img { font-size: 48px; margin-bottom: 5px; }
        .icon-label { font-size: 12px; word-break: break-word; color: #333; }

        /* Notepad Modal */
        .notepad-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); display: none; justify-content: center; align-items: center; z-index: 100; }
        .notepad { width: 600px; height: 400px; background: #fff; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .notepad-content { flex-grow: 1; padding: 15px; font-family: 'Consolas', monospace; white-space: pre-wrap; overflow: auto; outline: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="desktop">
        <div class="window">
            <div class="title-bar">
                <span style="font-size: 12px;">Explorador de Archivos</span>
                <div class="controls"><div class="control min"></div><div class="control max"></div><div class="control close"></div></div>
            </div>
            <div class="nav-bar">
                <button class="nav-btn" onclick="goUp()">⬆</button>
                <div class="path-box" id="path">Este Equipo > Clases</div>
            </div>
            <div class="content" id="file-view"></div>
        </div>
    </div>

    <div class="notepad-overlay" id="notepad-overlay">
        <div class="notepad">
            <div class="title-bar" style="background:#f3f3f3; border-bottom:1px solid #ddd;">
                <span id="notepad-title" style="font-size: 12px;">Bloc de notas</span>
                <div class="controls"><div class="control close" onclick="closeNotepad()"></div></div>
            </div>
            <div class="notepad-content" id="notepad-text"></div>
        </div>
    </div>

    <script>
        // Esto nos avisará si hay un error en la página web
        window.onerror = function(message, source, lineno, colno, error) {
            alert("Error detectado:\n" + message + "\nLínea: " + lineno);
        };

        const fileSystem = {
            name: "root",
            type: "folder",
            children: []
        };

        // --- ZONA DE EDICIÓN FÁCIL ---
        // Aquí puedes agregar tus archivos fácilmente.
        // El número (1, 2, etc.) corresponde a la carpeta de la Clase.
        const contenidoClases = {
            1: [
                { nombre: "resumen de clase 1.txt", texto: "diferencia de datos e informacion\n\nUn dato es la unidad mínima de información, un dato por sí solo no tiene significado pero cuando se le agrega un contexto el dato se convierte en información" },
                { nombre: "resumen de clase 2.txt", texto: "conceptos de estructuras de datos\n\nLas estructuras de datos son una forma de organizar y almacenar datos para poder usarlos, acceder a ellos y modificarlos de manera eficiente"},
                { nombre: "actividad_1.txt", texto: "Act 1: ¿Cuál crees que es una aplicación que utilizas que dependa de estructuras de datos?\n\nR: Netflix, Youtube, Spotify" },
                { nombre: "actividad_2.txt", texto: "Act 2: ¿Por qué crees que fueron diseñados así?\n\nR: Ya que es necesario por la forma en que actúan sus plataformas guardando gustos y todo su contenido y necesitarían una forma rápida y precisa de usar toda la información sin tardanzas." },
                { nombre: "actividad_3.txt", texto: "Act 3: Un ejemplo cotidiano usando algoritmo que se relacione con estructura de datos\n\nR: Jugar videojuegos, tiene un algoritmo simple, enciende el aparato, juega, se aburre, deja de jugar, pero también necesitas más información y más datos para poder entender todo." }
        ],
            3: [
                { nombre: "resumen de clase 1.txt", texto: "tipos de datos y algoridmos\n\nUn algoritmo es un conjunto ordenado de pasos que describen cómo resolver un problema o realizar una tarea. Los algoritmos permiten convertir datos en información mediante distintos procesos por eso son tan importantes." },
                { nombre: "actividad_1.txt", texto: "Act 1: Un ejemplo cotidiano usando algoritmo que se relacione con estructura de datos\n\nR: Jugar videojuegos, tiene un algoritmo simple, enciende el aparato, juega, se aburre, deja de jugar, pero también necesitas más información y más datos para poder entender todo."},
                { nombre: "actividad_2.txt", texto: "Act 2: ¿Qué pasaria si una aplicacion popular tuviera algoritmos ineficientes?\n\nLa aplicación sería mucho más lenta y pesada al intentar manejar grandes cantidades de datos"},
                { nombre: "actividad_3.txt", texto: "Act 3: ¿Cómo influye el tamaño de los datos en el diseño del software?\n\nUn algoritmo que funciona bien con pocos datos puede volverse muy lento cuando los datos crecen"},
                // Ejemplo: Para agregar algo a la clase 2, quita las barras // de abajo:
                // { nombre: "tarea_nueva.txt", texto: "Escribe aquí tu pregunta.\n\nEscribe aquí tu respuesta." }
            ],

            4:[
                { nombre: "resumen de clase 1.txt", texto: "NOTACIÓN BIG O\n\nLa notación Big O se usa para describir qué tan eficiente es un algoritmo, indicando cómo crece el tiempo o la memoria que necesita cuando aumenta la cantidad de datos de entrada." },
                { nombre: "tarea_1.txt", texto: "¿Cómo creen que podrían organizar mejor la información en su repositorio web para que sea más clara y fácil de actualizar?\n\n mediante carpetas y archivos de texto similar a como se hace en el propio ordenador para mantener un registro de las actividades"},
                { nombre: "tarea_2.txt", texto: "VENTAJAS DE UN EDITOR DE CÓDIGO Y FUNCIONES\n\nEl editor de código ofrece resaltado de sintaxis, lo que permite distinguir fácilmente palabras clave, variables y errores, haciendo el código más legible y reduciendo fallos"},
            ],
            6:[
                { nombre: "resumen de clase 1.txt", texto: "importancia de las herramientas y planeacion de codigo\n\nEn esta clase vimos la importancia de incorporar un codigo planeado para mejorar y crecer a tus proyectos tanto personales como profecionales." },
                { nombre: "actividad_1.txt", texto: "¿De que manera influyen las herramientas de desarrollo en la organizacion y en la calidad del codigo?\n\nmientras mejores sean las herramientas usadas mejor calidad trabajo y mas claro sera para el usuario el como acceder y usar la erramienta, ademas de que el codigo debe estar preparado para un crecimiento exponencial en caso de que la empresa sobrepase su tamaño actual"},
            ],
            7:[
                { nombre: "resumen de clase 1.txt", texto: "vimos como se hace una lista enlazada en python y en java"},
                { nombre: "actividad_1.txt", texto: "¿En que casos seria mejor una lista enlazada que un arreglo\n\nuna lista enlazada seria mejor en proyectos grandes y donde la lista debe actualizarse rapidamente y tener en cuenta cada uno de los datos dentro, mientras que las listas comunes seria mejores para proyectos pequeños en donde un dato no afecta al otro o simplemente va a haber un numero muy limitado de datos dentro"},
                { nombre: "actividad_2.txt", texto: "¿Lista enlazada?\n\nno se subio a peticion del profesor"}
            ],
            8:[
                {nombre: "resumen de clase 1.txt", texto: "vimos las ventajas de las listas enlazadas y las listas doblemente enlazadas"},
                {nombre: "actuvidad 1.txt", texto:"diferencias entre listas dobles, enlazadas y circulares\n\n la enlazada contiene un nodo y un puntero lo que le permite tener conocimiento de la siguiente o anterior nodo,pero no de ambos. La lista doble tiene conocimiento de el anterior y el siguiente nodo permitiendo una busqueda mas repida y precisa, pero ocupa mas memoria. la lista circular puede ser enlazada o doble, pero el ultimo nodo mirara al primero en vez de ver a null"},
            ],
            9:[
                {nombre: "resumen de clase 1.txt",texto: "En esta clase vimos los arreglos, que son una de las estructuras de datos más simples y más utilizadas en programación."}

            ],

            10:[
                {nombre: "resumen de clase 1.txt", texto: "En esta clase vimos la estructura de datos llamada pila."}
            ],

            11:[
                {nombre: "resumen de clase 1.txt", texto: "En esta clase vimos la estructura de datos llamada cola."}
            ],

            12:[
                {nombre: "resumen de clase 1.txt", texto: "En esta clase comenzamos a estudiar los árboles binarios,que son estructuras de datos jerárquicas."}
            ],

            13:[
                {nombre: "resumen de clase 1.txt", texto: "También vimos un tipo especial de árbol binario llamado árbol binario de búsqueda."}
            ],

            14:[
                {nombre: "resumen de clase 1.txt", texto: "En esta clase vimos las diferentes formas de recorrer un árbol binario para visitar todos sus nodos."}
            ],

            20:[
                {nombre: "resumen de clase 1.txt", texto: "aprendimos a dibujar grafos y como funcionan"},
                {nombre: "tarea 1.txt", texto: "usos comunes y algoritmos para manejar grafos\n\nBúsqueda en profundidad (DFS): Utilizado para explorar todos los nodos de un grafo\nBúsqueda en anchura (BFS): Ideal para encontrar el camino más corto en un grafo no ponderado\n Dijkstra: Empleado para determinar el camino más corto en un grafo ponderado.\n Kruskal y Prim: Utilizados para encontrar árboles de expansión mínima.\n  Algoritmo de Bellman Ford: Utilizado para encontrar el camino más corto en grafos con pesos negativos y detectar ciclos. \nEstos algoritmos son fundamentales en la teoría de grafos y tienen aplicaciones en redes sociales, optimización de rutas y análisis de datos complejos"}
            ]
        };
        // -----------------------------

        // Obtiene las claves (números de clase), las ordena numéricamente y luego itera
        // para crear solo las carpetas que has definido en 'contenidoClases'.
        Object.keys(contenidoClases).sort((a, b) => a - b).forEach(classNumber => {
            const classContent = contenidoClases[classNumber];
            let files = [];

            classContent.forEach(archivo => {
                files.push({ name: archivo.nombre, type: "file", content: archivo.texto });
            });

            fileSystem.children.push({ name: "Clase " + classNumber, type: "folder", children: files });
        });

        let currentDir = fileSystem;
        let pathStack = [];

        function render() {
            console.log("render() called. Current directory:", currentDir.name, "Children count:", currentDir.children.length);
            const view = document.getElementById('file-view');
            view.innerHTML = '';
            document.getElementById('path').innerText = currentDir === fileSystem ? "Este Equipo > Clases" : "Este Equipo > Clases > " + currentDir.name;

            currentDir.children.forEach(item => {
                const el = document.createElement('div');
                el.className = 'icon';
                console.log("Creating icon for:", item.name, "Type:", item.type);
                el.onclick = () => openItem(item);
                el.innerHTML = `
                    <div class="icon-img" style="color: ${item.type === 'folder' ? '#ffe680' : '#89cff0'}">${item.type === 'folder' ? '📁' : '📄'}</div>
                    <div class="icon-label">${item.name}</div>
                `;
                view.appendChild(el);
            });
        }

        function openItem(item) {
            if (item.type === 'folder') {
                pathStack.push(currentDir);
                currentDir = item;
                render();
            } else {
                document.getElementById('notepad-title').innerText = item.name + " - Bloc de notas";
                document.getElementById('notepad-text').innerText = item.content;
                document.getElementById('notepad-overlay').style.display = 'flex';
            }
        }

        function goUp() {
            if (pathStack.length > 0) {
                currentDir = pathStack.pop();
                render();
            }
        }

        function closeNotepad() { document.getElementById('notepad-overlay').style.display = 'none'; }
        console.log("Initializing file explorer...");
        render();
    </script>
</body>
</html>
